<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kadan - Painel de Produção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">

<!-- Firebase (Realtime Database + Authentication anônima) — SDK "compat", sem necessidade de build/bundler -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<style>
  :root{
    --bg:#0A1210;
    --surface:#122019;
    --surface-2:#182A22;
    --surface-3:#20362B;
    --ink:#EAF2EE;
    --ink-muted:#9FB3AB;
    --ink-faint:#6E8580;
    --border:#26392F;
    --accent:#F0895F;
    --teal:#5CD9B4;
    --teal-soft:#12352A;
    --good:#5FC488;
    --good-soft:#123322;
    --warning:#E4AC4F;
    --warning-soft:#3A2E15;
    --critical:#E37D73;
    --critical-soft:#3B211E;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
    --font-display:'Manrope', 'Segoe UI', sans-serif;
    --font-body:'IBM Plex Sans', 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
  body{padding:16px 20px 20px;min-height:100vh;}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:-0.01em;margin:0;}

  /* ---- Header ---- */
  .kds-header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
  .kds-brand{display:flex;align-items:center;gap:12px;}
  .kds-brand-mark{
    width:40px;height:40px;border-radius:11px;background:linear-gradient(155deg,var(--accent),#c94f2b);
    display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:var(--shadow);
  }
  .kds-brand h1{font-size:1.15rem;}
  .kds-brand p{margin:1px 0 0;font-size:.78rem;color:var(--ink-muted);}
  .kds-status{display:flex;align-items:center;gap:16px;}
  .kds-live{
    display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:.76rem;color:var(--ink-muted);
    background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 12px;
  }
  .kds-dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex-shrink:0;animation:kdsPulse 2s ease-in-out infinite;}
  @keyframes kdsPulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .kds-clock{font-family:var(--font-mono);font-size:1.4rem;font-weight:700;line-height:1;text-align:right;}
  .kds-date{font-size:.74rem;color:var(--ink-muted);text-align:right;margin-top:1px;text-transform:capitalize;}

  .kds-banner{
    background:var(--warning-soft);border:1px solid var(--warning);color:var(--warning);border-radius:12px;
    padding:12px 16px;margin-bottom:14px;font-size:.88rem;line-height:1.5;
  }
  .kds-banner strong{color:var(--ink);}

  /* ---- Cards & grid ---- */
  .kds-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
  @media (max-width:980px){.kds-grid{grid-template-columns:1fr;}}
  .kds-card{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:14px 16px 16px;box-shadow:var(--shadow);margin-bottom:14px;
  }
  .kds-card:last-child{margin-bottom:0;}
  .kds-card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .kds-card-head h2{font-size:1rem;}
  .kds-card-head .hint{font-size:.8rem;color:var(--ink-faint);font-family:var(--font-mono);}

  .kds-kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px;}
  @media (max-width:560px){.kds-kpi-row{grid-template-columns:1fr;}}
  .kds-kpi{background:var(--teal-soft);border-radius:14px;padding:16px 18px;}
  .kds-kpi .label{font-size:.8rem;color:var(--teal);font-weight:700;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}
  .kds-kpi .value{font-family:var(--font-mono);font-size:2rem;font-weight:700;color:var(--ink);}
  .kds-kpi .value .u{font-size:1rem;color:var(--ink-faint);font-weight:500;margin-left:4px;}

  .kds-cat-panel{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
  .kds-cat-title{
    font-family:var(--font-display);font-weight:700;font-size:.78rem;text-transform:uppercase;
    letter-spacing:.05em;color:var(--ink-muted);margin-bottom:10px;
  }

  /* ---- Categorias por pedido (matriz) ---- */
  .kds-table-wrap{overflow-x:auto;}
  .kds-table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:480px;color:var(--ink);}
  .kds-table th, .kds-table td{padding:7px 14px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;}
  .kds-table th:first-child, .kds-table td:first-child{padding-left:0;}
  .kds-table th:last-child, .kds-table td:last-child{padding-right:0;}
  .kds-table th:not(:first-child), .kds-table td:not(:first-child){border-left:1px solid var(--border);}
  .kds-table thead th{font-family:var(--font-display);font-weight:700;font-size:.86rem;color:var(--ink);border-bottom:2px solid var(--border);}
  .kds-table tbody tr:last-child td{border-bottom:none;}
  .kds-matrix-cat{font-family:var(--font-display);font-weight:700;color:var(--ink);}
  .kds-matrix-status{display:block;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:3px;}
  .kds-matrix-status.warning{color:var(--warning);}
  .kds-matrix-status.good{color:var(--good);}
  .kds-matrix-frac{font-family:var(--font-mono);font-weight:600;margin-right:10px;}
  .kds-matrix-pct{font-family:var(--font-mono);font-weight:700;color:var(--ink-muted);}
  .kds-matrix-pct.good{color:var(--good);}
  .kds-matrix-empty{color:var(--ink-faint);}
  .kds-matrix-total-col{background:var(--surface-2);}
  .kds-table thead th.kds-matrix-total-col{color:var(--teal);}
  .kds-table-total-row td{font-weight:700;background:var(--surface-2);}

  /* ---- Funcionários ---- */
  .kds-func-card{border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:var(--surface-2);}
  .kds-func-card:last-child{margin-bottom:0;}
  .kds-func-card.total{background:var(--teal-soft);border-color:transparent;}
  .kds-func-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .kds-func-head strong{font-family:var(--font-display);font-size:1.02rem;}
  .kds-func-total{font-family:var(--font-mono);font-weight:700;font-size:.95rem;color:var(--teal);}
  .kds-chips{display:flex;flex-wrap:wrap;gap:14px;}
  .kds-chip{display:flex;flex-direction:column;gap:0;min-width:64px;}
  .kds-chip .k{font-size:.68rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.03em;}
  .kds-chip .v{font-family:var(--font-mono);font-weight:700;font-size:1rem;}

  /* ---- Lotes de hoje ---- */
  .kds-lote-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--border);font-size:.92rem;}
  .kds-lote-row:first-child{border-top:none;}
  .kds-lote-row .nome{font-weight:700;}
  .kds-lote-row .rend{font-family:var(--font-mono);font-weight:700;}

  .kds-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 16px;text-align:center;color:var(--ink-muted);}
  .kds-empty .icon{font-size:1.5rem;}
  .kds-empty p{margin:0;font-size:.92rem;max-width:38ch;}
</style>
</head>
<body>

  <div class="kds-header">
    <div class="kds-brand">
      <div class="kds-brand-mark" aria-hidden="true">🐟</div>
      <div>
        <h1>Kadan · Painel de Produção</h1>
        <p>Acompanhamento em tempo real — não requer login</p>
      </div>
    </div>
    <div class="kds-status">
      <div class="kds-live"><span class="kds-dot" id="kdsDot"></span><span id="kdsLiveText">conectando…</span></div>
      <div>
        <div class="kds-clock" id="kdsClock">--:--:--</div>
        <div class="kds-date" id="kdsDate">—</div>
      </div>
    </div>
  </div>

  <div id="kdsBanner"></div>

  <div class="kds-card">
    <div class="kds-card-head">
      <h2>Total do dia · todos os pedidos</h2>
    </div>
    <div id="kdsTotalDia"></div>
  </div>

  <div class="kds-grid">
    <div class="kds-card">
      <div class="kds-card-head">
        <h2>Produção por funcionário (hoje)</h2>
      </div>
      <div id="kdsFuncionarios"></div>
    </div>
    <div class="kds-card">
      <div class="kds-card-head">
        <h2>Abertura dos peixes</h2>
      </div>
      <div id="kdsLotes"></div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  /* ---------------- Firebase (mesmo projeto do app principal) ---------------- */
  var firebaseConfig = {
    apiKey: "AIzaSyDF8tXjLn_YrHnu5hGIHfuz5wJawUj1zZU",
    authDomain: "kadan-producao.firebaseapp.com",
    databaseURL: "https://kadan-producao-default-rtdb.firebaseio.com",
    projectId: "kadan-producao",
    storageBucket: "kadan-producao.firebasestorage.app",
    messagingSenderId: "104751109467",
    appId: "1:104751109467:web:b4409362b66e72db64f67e"
  };
  var firebaseConfigured = firebaseConfig.apiKey !== "SUBSTITUA_AQUI" && !!firebaseConfig.databaseURL;

  var state = { lotes: [], pedidos: [], envios: [], funcionarios: [] };

  function setBanner(html){ document.getElementById('kdsBanner').innerHTML = html; }
  function setLive(text, ok){
    document.getElementById('kdsLiveText').textContent = text;
    document.getElementById('kdsDot').style.background = ok ? 'var(--good)' : 'var(--critical)';
  }

  /* ---------------- helpers (mesma lógica do app principal) ---------------- */
  function dataLocalISO(d){
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function todayISO(){ return dataLocalISO(new Date()); }
  function n(v){ v = parseFloat(v); return isNaN(v) ? 0 : v; }
  function fmtNum(v){ return Math.round(v).toLocaleString('pt-BR'); }
  function fmtPct(v){ return (Math.round(v*10)/10).toLocaleString('pt-BR') + '%'; }
  function fmtTime(iso){
    var d = new Date(iso);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function loteRendimento(l){
    return l.pesoInicial > 0 ? (l.liquido / l.pesoInicial * 100) : 0;
  }
  function enviadoTotal(pedidoId, produto){
    return state.envios.filter(function(e){ return e.pedidoId===pedidoId && e.produto===produto; })
      .reduce(function(s,e){ return s + e.quantidade; }, 0);
  }
  function categoriaDoEnvio(e){
    var pedido = state.pedidos.find(function(p){ return p.id === e.pedidoId; });
    if(!pedido) return 'Outros';
    var item = pedido.itens.find(function(it){ return it.produto === e.produto; });
    return (item && item.familia) || 'Outros';
  }
  function calcPedidoResumo(pedido){
    var totalSolicitado = 0, totalEnviado = 0, itensCompletos = 0;
    var grupos = {}, ordemGrupos = [];
    pedido.itens.forEach(function(it){
      var fam = it.familia || 'Outros';
      if(!grupos[fam]){ grupos[fam] = []; ordemGrupos.push(fam); }
      grupos[fam].push(it);
    });
    ordemGrupos.sort(function(a,b){
      if(a === 'Outros') return 1;
      if(b === 'Outros') return -1;
      return 0;
    });
    var resumoCategorias = ordemGrupos.map(function(fam){
      var itensFam = grupos[fam];
      var famSolicitado = 0, famEnviadoCapped = 0;
      itensFam.forEach(function(it){
        var env = enviadoTotal(pedido.id, it.produto);
        var envCapped = Math.min(env, it.solicitado);
        totalSolicitado += it.solicitado;
        totalEnviado += envCapped;
        famSolicitado += it.solicitado;
        famEnviadoCapped += envCapped;
        if(env >= it.solicitado) itensCompletos++;
      });
      var famPct = famSolicitado > 0 ? Math.min(famEnviadoCapped / famSolicitado * 100, 100) : 0;
      return { nome: fam, solicitado: famSolicitado, enviado: famEnviadoCapped, pct: famPct };
    });
    var progressoGeral = totalSolicitado > 0 ? (totalEnviado / totalSolicitado * 100) : 0;
    var progressoItens = pedido.itens.length > 0 ? (itensCompletos / pedido.itens.length * 100) : 0;
    return {
      totalItens: pedido.itens.length,
      totalSolicitado: totalSolicitado,
      totalEnviado: totalEnviado,
      itensCompletos: itensCompletos,
      progressoItens: progressoItens,
      progressoGeral: progressoGeral,
      resumoCategorias: resumoCategorias
    };
  }
  function calcResumoAgregado(pedidos){
    var totalItens = 0, itensCompletos = 0, totalSolicitado = 0, totalEnviado = 0;
    var categoriasMap = {}, ordemCategorias = [];
    pedidos.forEach(function(pedido){
      var r = calcPedidoResumo(pedido);
      totalItens += r.totalItens;
      itensCompletos += r.itensCompletos;
      totalSolicitado += r.totalSolicitado;
      totalEnviado += r.totalEnviado;
      r.resumoCategorias.forEach(function(c){
        if(!categoriasMap[c.nome]){ categoriasMap[c.nome] = { solicitado:0, enviado:0 }; ordemCategorias.push(c.nome); }
        categoriasMap[c.nome].solicitado += c.solicitado;
        categoriasMap[c.nome].enviado += c.enviado;
      });
    });
    ordemCategorias.sort(function(a,b){
      if(a === 'Outros') return 1;
      if(b === 'Outros') return -1;
      return 0;
    });
    var resumoCategorias = ordemCategorias.map(function(nome){
      var d = categoriasMap[nome];
      var pct = d.solicitado > 0 ? Math.min(d.enviado / d.solicitado * 100, 100) : 0;
      return { nome: nome, solicitado: d.solicitado, enviado: d.enviado, pct: pct };
    });
    var progressoGeral = totalSolicitado > 0 ? (totalEnviado / totalSolicitado * 100) : 0;
    var progressoItens = totalItens > 0 ? (itensCompletos / totalItens * 100) : 0;
    return {
      totalItens: totalItens,
      totalSolicitado: totalSolicitado,
      totalEnviado: totalEnviado,
      itensCompletos: itensCompletos,
      progressoItens: progressoItens,
      progressoGeral: progressoGeral,
      resumoCategorias: resumoCategorias
    };
  }

  // Tabela: categorias nas linhas, um pedido por coluna (com status aberto/concluído) e,
  // na última coluna, o total agregado daquela categoria somando todos os pedidos do dia.
  function renderKdsTotalDia(pedidosHoje){
    var el = document.getElementById('kdsTotalDia');
    if(!pedidosHoje.length){
      el.innerHTML = '<div class="kds-empty"><div class="icon">🍣</div><p>Nenhum pedido importado hoje ainda.</p></div>';
      return;
    }

    var pedidosOrdenados = pedidosHoje.slice().sort(function(a,b){
      var aAberto = !a.concluidoEm, bAberto = !b.concluidoEm;
      if(aAberto !== bAberto) return aAberto ? -1 : 1;
      return new Date(b.criadoEm) - new Date(a.criadoEm);
    });

    var categoriasOrdem = [], categoriasSet = {};
    var porPedidoCategoria = {};
    pedidosOrdenados.forEach(function(p){
      var resumo = calcPedidoResumo(p);
      porPedidoCategoria[p.id] = {};
      resumo.resumoCategorias.forEach(function(c){
        porPedidoCategoria[p.id][c.nome] = c;
        if(!categoriasSet[c.nome]){ categoriasSet[c.nome] = true; categoriasOrdem.push(c.nome); }
      });
    });
    categoriasOrdem.sort(function(a,b){ if(a==='Outros') return 1; if(b==='Outros') return -1; return 0; });

    var agregado = calcResumoAgregado(pedidosHoje);
    var totalPorCategoria = {};
    agregado.resumoCategorias.forEach(function(c){ totalPorCategoria[c.nome] = c; });

    var theadHtml = '<tr><th>Categoria</th>' + pedidosOrdenados.map(function(p){
      var statusHtml = p.concluidoEm
        ? '<span class="kds-matrix-status good">concluído</span>'
        : '<span class="kds-matrix-status warning">aberto</span>';
      return '<th>' + escapeHtml(p.nome) + statusHtml + '</th>';
    }).join('') + '<th class="kds-matrix-total-col">Total</th></tr>';

    var tbodyHtml = categoriasOrdem.map(function(cat){
      var cells = pedidosOrdenados.map(function(p){
        var d = porPedidoCategoria[p.id][cat];
        if(!d) return '<td class="kds-matrix-empty">—</td>';
        var pctClass = d.pct >= 100 ? 'good' : '';
        return '<td><span class="kds-matrix-frac">' + fmtNum(d.enviado) + '/' + fmtNum(d.solicitado) + '</span><span class="kds-matrix-pct ' + pctClass + '">' + fmtPct(d.pct) + '</span></td>';
      }).join('');
      var t = totalPorCategoria[cat];
      var tPctClass = t && t.pct >= 100 ? 'good' : '';
      var totalCell = t
        ? '<td class="kds-matrix-total-col"><span class="kds-matrix-frac">' + fmtNum(t.enviado) + '/' + fmtNum(t.solicitado) + '</span><span class="kds-matrix-pct ' + tPctClass + '">' + fmtPct(t.pct) + '</span></td>'
        : '<td class="kds-matrix-empty kds-matrix-total-col">—</td>';
      return '<tr><td class="kds-matrix-cat">' + escapeHtml(cat) + '</td>' + cells + totalCell + '</tr>';
    }).join('');

    el.innerHTML = '<div class="kds-table-wrap"><table class="kds-table"><thead>' + theadHtml + '</thead><tbody>' + tbodyHtml + '</tbody></table></div>';
  }

  // "Abertura dos peixes": tabela com os lotes do dia e seus detalhes de aproveitamento.
  function renderKdsLotes(lotesHoje){
    var el = document.getElementById('kdsLotes');
    if(!lotesHoje.length){
      el.innerHTML = '<div class="kds-empty"><div class="icon">🐟</div><p>Nenhum lote registrado hoje ainda.</p></div>';
      return;
    }
    var theadHtml = '<tr><th>Lote</th><th>Peso inicial</th><th>Lombo</th><th>Barriga</th><th>Peso líquido</th><th>Aproveitamento</th></tr>';
    var tbodyHtml = lotesHoje.map(function(l){
      var rend = loteRendimento(l);
      var pctClass = rend >= 100 ? 'good' : '';
      return '<tr>' +
        '<td class="kds-matrix-cat">' + escapeHtml(l.lote) + '</td>' +
        '<td>' + fmtNum(l.pesoInicial) + ' g</td>' +
        '<td>' + fmtNum(l.lombo) + ' g</td>' +
        '<td>' + fmtNum(l.barriga) + ' g</td>' +
        '<td>' + fmtNum(l.liquido) + ' g</td>' +
        '<td><span class="kds-matrix-pct ' + pctClass + '">' + fmtPct(rend) + '</span></td>' +
      '</tr>';
    }).join('');
    el.innerHTML = '<div class="kds-table-wrap"><table class="kds-table"><thead>' + theadHtml + '</thead><tbody>' + tbodyHtml + '</tbody></table></div>';
  }

  // Produção por funcionário, resumida em tabela: funcionários nas linhas, categorias
  // nas colunas, total por funcionário na última coluna e uma linha de total geral.
  function renderKdsFuncionarios(enviosHoje){
    var el = document.getElementById('kdsFuncionarios');
    if(!enviosHoje.length){
      el.innerHTML = '<div class="kds-empty"><div class="icon">🧑‍🍳</div><p>Nenhum lançamento registrado hoje ainda.</p></div>';
      return;
    }
    var porFuncionario = {}, funcionariosOrdem = [], categoriasSet = {}, categoriasOrdem = [];
    enviosHoje.forEach(function(e){
      var nome = (e.funcionario && String(e.funcionario).trim()) || 'Não informado';
      var cat = categoriaDoEnvio(e);
      if(!porFuncionario[nome]){ porFuncionario[nome] = { __total: 0 }; funcionariosOrdem.push(nome); }
      porFuncionario[nome][cat] = (porFuncionario[nome][cat] || 0) + e.quantidade;
      porFuncionario[nome].__total += e.quantidade;
      if(!categoriasSet[cat]){ categoriasSet[cat] = true; categoriasOrdem.push(cat); }
    });
    categoriasOrdem.sort(function(a,b){ if(a==='Outros') return 1; if(b==='Outros') return -1; return 0; });
    funcionariosOrdem.sort(function(a,b){ return porFuncionario[b].__total - porFuncionario[a].__total; });

    var totalPorCategoria = {}; categoriasOrdem.forEach(function(c){ totalPorCategoria[c] = 0; });
    var totalGeral = 0;

    var linhasHtml = funcionariosOrdem.map(function(nome){
      var d = porFuncionario[nome];
      totalGeral += d.__total;
      var cells = categoriasOrdem.map(function(c){
        var v = d[c] || 0;
        totalPorCategoria[c] += v;
        return '<td>' + (v > 0 ? fmtNum(v) : '<span class="kds-matrix-empty">—</span>') + '</td>';
      }).join('');
      return '<tr><td class="kds-matrix-cat">' + escapeHtml(nome) + '</td>' + cells + '<td class="kds-matrix-total-col">' + fmtNum(d.__total) + '</td></tr>';
    }).join('');

    var totalCells = categoriasOrdem.map(function(c){ return '<td>' + fmtNum(totalPorCategoria[c]) + '</td>'; }).join('');
    var totalRowHtml = '<tr class="kds-table-total-row"><td>Total geral</td>' + totalCells + '<td class="kds-matrix-total-col">' + fmtNum(totalGeral) + '</td></tr>';

    var theadHtml = '<tr><th>Funcionário</th>' + categoriasOrdem.map(function(c){ return '<th>' + escapeHtml(c) + '</th>'; }).join('') + '<th class="kds-matrix-total-col">Total</th></tr>';

    el.innerHTML = '<div class="kds-table-wrap"><table class="kds-table"><thead>' + theadHtml + '</thead><tbody>' + linhasHtml + totalRowHtml + '</tbody></table></div>';
  }

  /* ---------------- render ---------------- */
  function renderKDS(){
    var hoje = todayISO();

    var pedidosHoje = state.pedidos.filter(function(p){ return dataLocalISO(new Date(p.criadoEm)) === hoje; });
    renderKdsTotalDia(pedidosHoje);

    var enviosHoje = state.envios.filter(function(e){ return dataLocalISO(new Date(e.horario)) === hoje; });
    renderKdsFuncionarios(enviosHoje);

    var lotesHoje = state.lotes.filter(function(l){ return l.data === hoje; });
    renderKdsLotes(lotesHoje);
  }

  /* ---------------- relógio ---------------- */
  function tickClock(){
    var d = new Date();
    document.getElementById('kdsClock').textContent =
      String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
    var dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
    var meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    document.getElementById('kdsDate').textContent = dias[d.getDay()] + ', ' + d.getDate() + ' ' + meses[d.getMonth()] + '.';
  }
  tickClock();
  setInterval(tickClock, 1000);
  // Recalcula os cards à meia-noite (troca de "hoje") mesmo sem nenhum dado novo chegar.
  setInterval(renderKDS, 60000);

  /* ---------------- conexão ---------------- */
  if(!firebaseConfigured){
    setLive('Firebase não configurado', false);
    setBanner('<div class="kds-banner"><strong>Firebase não configurado.</strong> Configure o <code>firebaseConfig</code> no arquivo kds.html (mesmos dados usados no index.html) para este painel funcionar.</div>');
    renderKDS();
  } else {
    try{
      firebase.initializeApp(firebaseConfig);
      var db = firebase.database();
      var auth = firebase.auth();
    }catch(e){
      setLive('Erro ao iniciar Firebase', false);
      setBanner('<div class="kds-banner"><strong>Erro ao iniciar o Firebase:</strong> ' + escapeHtml(e.message || String(e)) + '</div>');
    }
    if(auth){
      setLive('conectando…', false);
      auth.signInAnonymously().then(function(){
        setLive('ao vivo', true);
        setBanner('');
        iniciarListeners();
      }).catch(function(err){
        setLive('não foi possível conectar', false);
        setBanner(
          '<div class="kds-banner"><strong>Não foi possível conectar ao Firebase para exibir os dados sem login.</strong><br>' +
          'Ative o método de login "Anônimo" no Firebase Console (Authentication → Sign-in method → Anonymous) e recarregue esta página.<br>' +
          '<span style="color:var(--ink-faint);font-family:var(--font-mono);font-size:.78rem;">Detalhe técnico: ' + escapeHtml(err.code || '') + ' ' + escapeHtml(err.message || '') + '</span></div>'
        );
      });
    }
  }

  function iniciarListeners(){
    db.ref('lotes').on('value', function(snap){ state.lotes = snap.val() || []; renderKDS(); });
    db.ref('pedidos').on('value', function(snap){ state.pedidos = snap.val() || []; renderKDS(); });
    db.ref('envios').on('value', function(snap){ state.envios = snap.val() || []; renderKDS(); });
    db.ref('funcionarios').on('value', function(snap){ state.funcionarios = snap.val() || []; renderKDS(); });
  }

})();
</script>
</body>
</html>
